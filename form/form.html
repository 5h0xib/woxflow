<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" class="Title logo" href="/wox/gallery/Wlogo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="form.css">

    <!-- AOS CSS -->
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <!-- AOS JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <title>form</title>
</head>
<body>
    <header>
        <div class="contact-section">
            <div class="contact-form">
              <h2 data-aos="fade-down" data-aos-delay="100">GET STARTED</h2>
              <form class="contact" action="https://api.web3forms.com/submit?redirect=https://woxflow.in/success.html" method="post">
                <input data-aos="fade-left" data-aos-delay="200" type="hidden" name="access_key" value="66b058d6-2a27-41db-bd33-c2e12aee64dc">
                <input data-aos="fade-right" data-aos-delay="300" type="hidden" name="redirect" value="https://woxflow.in/success.html">
                <input data-aos="fade-left" data-aos-delay="400" type="text" name="name" class="text-box" placeholder="Your Name" required>
                <input data-aos="fade-right" data-aos-delay="500" type="email" name="email" class="text-box" placeholder="Your Email" required>
                <input data-aos="fade-left" data-aos-delay="600" type="number" name="phone" class="text-box" placeholder="Your Phone no" required>
                <textarea data-aos="fade-right" data-aos-delay="700" name="message" rows="2" placeholder="Your Message" required></textarea>
                <button data-aos="fade-up" data-aos-delay="800" type="submit" class="send-btn" value="Send">submit</button>
              </form>
              <p data-aos="fade-up" data-aos-delay="800" class="contact-para">NOTE: Enter correct info</p>
            </div>
        </div>
    </header>
</body>
<script>
    AOS.init({
        duration: 1200,
        once: true,
    });
</script>
</html>
