<!-- Portfolio Page -->
<div class="portfolio-page">

    <!-- Page Header -->
    <section class="page-header section" style="background-color: var(--color-gray-light);">
        <div class="container text-center">
            <div scroll-animate>
                <h1>Our Work</h1>
                <p class="color-gray"
                    style="font-size: var(--font-size-lg); max-width: 700px; margin: var(--spacing-lg) auto 0;">A
                    showcase of projects we're proud of</p>
            </div>
        </div>
    </section>

    <!-- Portfolio Grid -->
    <section class="portfolio-grid-section section">
        <div class="container">
            <div class="portfolio-grid grid grid-2">
                <div class="portfolio-item overlay-container" ng-repeat="project in vm.projects" scroll-animate
                    scroll-delay="{{$index * 100}}">
                    <a ng-href="{{project.url}}" target="_blank" rel="noopener noreferrer" class="portfolio-link">
                        <div class="portfolio-image">
                            <img ng-src="{{project.image}}" alt="{{project.name}}" />
                        </div>
                        <div class="overlay">
                            <div class="overlay-content">
                                <h3 class="overlay-text">{{project.name}}</h3>
                                <p
                                    style="color: {{project.color}}; font-weight: 600; text-shadow: 0 0 16px rgba(255, 255, 255, 0.8);">
                                    {{project.type}}</p>
                                <p
                                    style="color: var(--color-secondary); font-weight: 500; text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);">
                                    {{project.description}}</p>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- CTA Section -->
    <section class="cta-section section" style="background-color: var(--color-gray-light);">
        <div class="container text-center">
            <div scroll-animate>
                <h2 class="mb-md">Let's Create Your Success Story</h2>
                <p class="color-gray mb-xl" style="font-size: var(--font-size-lg);">Ready to join our portfolio?</p>
                <a href="#!/contact" class="btn btn-large">Start a Project</a>
            </div>
        </div>
    </section>

</div>

<style>
    /* Portfolio Page Specific Styles */
    .portfolio-grid {
        gap: var(--spacing-2xl);
    }

    .portfolio-item {
        aspect-ratio: 16 / 10;
        border: 2px solid var(--color-accent);
        transition: all var(--transition-base);
    }

    .portfolio-item:hover {
        border-color: var(--color-primary);
        box-shadow: var(--shadow-lg);
    }

    .portfolio-image {
        width: 100%;
        height: 100%;
    }

    .portfolio-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(100%);
        transition: filter var(--transition-base);
    }

    .portfolio-item:hover .portfolio-image img {
        filter: grayscale(0%);
    }

    .overlay-content {
        padding: var(--spacing-lg);
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100%;
    }

    .overlay-content h3 {
        margin-bottom: var(--spacing-sm);
        font-size: var(--font-size-xl);
        line-height: 1.2;
    }

    .overlay-content p {
        margin-bottom: var(--spacing-xs);
        font-size: var(--font-size-sm);
        line-height: 1.4;
    }

    .portfolio-link {
        color: var(--color-secondary);
        text-decoration: none;
        display: block;
        height: 100%;
    }

    .portfolio-item {
        cursor: pointer;
    }

    @media (max-width: 768px) {
        .portfolio-grid {
            gap: var(--spacing-lg);
            grid-template-columns: 1fr;
        }

        .overlay-content h3 {
            font-size: var(--font-size-lg);
        }

        .overlay-content p {
            font-size: var(--font-size-xs);
        }
    }
</style>
